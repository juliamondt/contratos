<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gerador de Contratos</title>
<meta name="description" content="Gere contratos de prestação de serviços em segundos, a partir de modelos validados. Grátis, sem cadastro — tudo fica no seu dispositivo.">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<main class="layout">

  <!-- ===================== FORM (EDIT) ===================== -->
  <section class="pane pane--edit" id="paneEdit">

    <div class="edit-header">
      <h1>Novo contrato</h1>
      <button id="toggleViewBtn" class="btn btn--dark" type="button">Visualizar</button>
    </div>

    <div class="accordion">

      <!-- Tipo de contrato -->
      <div class="acc-item is-open" data-acc="tipo">
        <button class="acc-header" type="button">
          <span class="acc-title">Tipo de contrato</span>
          <span class="acc-right"><span class="acc-summary" id="sumTipo">—</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <div class="field">
            <label>Serviço</label>
            <select id="fTipo"></select>
          </div>
          <div class="field" id="wrapTipoProjeto" hidden>
            <label>Tipo de projeto</label>
            <input type="text" id="fTipoProjeto" placeholder="Ex: Identidade Visual Completa">
          </div>
        </div>
      </div>

      <!-- Cliente -->
      <div class="acc-item" data-acc="cliente">
        <button class="acc-header" type="button">
          <span class="acc-title">Cliente <span class="req">*</span></span>
          <span class="acc-right"><span class="acc-summary" id="sumCliente">Obrigatório</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <div class="field"><label>Nome do cliente <span class="req">*</span></label><input type="text" id="cNome" placeholder="Nome completo ou razão social"></div>
          <div class="field"><label>CPF/CNPJ <span class="req">*</span></label><input type="text" id="cDoc" placeholder="Documento do cliente"></div>
          <div class="field"><label>Endereço <span class="opt">(opcional)</span></label><input type="text" id="cEndereco"></div>
          <div class="field-row">
            <div class="field"><label>E-mail <span class="opt">(opcional)</span></label><input type="email" id="cEmail"></div>
            <div class="field"><label>Telefone <span class="opt">(opcional)</span></label><input type="text" id="cTelefone"></div>
          </div>
          <div class="field" id="wrapNomeProjeto" hidden>
            <label>Nome do projeto/marca <span class="req">*</span></label>
            <input type="text" id="fNomeProjeto" placeholder="Ex: MyContent">
          </div>
          <div class="field" id="wrapSegmento" hidden>
            <label>Segmento <span class="opt">(opcional)</span></label>
            <input type="text" id="fSegmento" placeholder="Ex: Agência de Publicidade">
          </div>
        </div>
      </div>

      <!-- Itens IDV (só aparece pra Identidade Visual) -->
      <div class="acc-item" data-acc="itensIdv" id="accItensIdv" hidden>
        <button class="acc-header" type="button">
          <span class="acc-title">Aplicações incluídas</span>
          <span class="acc-right"><span class="acc-summary" id="sumItensIdv">Nenhuma</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <p class="hint">Marque o que entra no escopo deste contrato.</p>
          <div id="idvItensList" class="check-list"></div>
        </div>
      </div>

      <!-- Pagamento e prazo -->
      <div class="acc-item" data-acc="pagamento">
        <button class="acc-header" type="button">
          <span class="acc-title">Valor, pagamento e prazo <span class="req">*</span></span>
          <span class="acc-right"><span class="acc-summary" id="sumPagamento">—</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <div class="field">
            <label>Valor combinado <span class="req">*</span></label>
            <div class="input-suffix"><span class="suffix">R$</span><input type="number" id="fValor" min="0" step="0.01" value="0"></div>
          </div>
          <div class="field" id="wrapParcelas">
            <label>Número de parcelas</label>
            <input type="number" id="fParcelas" min="1" step="1" value="1">
            <p class="hint" id="parcelaPreview" style="margin-top:2px;"></p>
          </div>
          <div class="field" id="wrapEntradaFinal" hidden>
            <p class="hint">Pagamento automático: 30% na assinatura, 70% na entrega final.</p>
          </div>
          <div class="field">
            <label>Prazo de entrega (dias úteis) <span class="req">*</span></label>
            <input type="number" id="fPrazo" min="1" step="1" value="15">
          </div>
        </div>
      </div>

      <!-- Prestador / Contratada (dados fixos) -->
      <div class="acc-item" data-acc="contratada">
        <button class="acc-header" type="button">
          <span class="acc-title">Contratada</span>
          <span class="acc-right"><span class="acc-summary" id="sumContratada">Nenhum</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <p class="hint">Salvo automaticamente neste dispositivo — preencha uma vez e ele lembra da próxima. <button class="link-btn" id="clearContratada" type="button">Limpar dados salvos</button></p>
          <div class="field"><label>Nome / Razão social</label><input type="text" id="pNome" placeholder="Ex: Estúdio Mondt"></div>
          <div class="field"><label>CNPJ</label><input type="text" id="pCnpj"></div>
          <div class="field"><label>Cidade-sede</label><input type="text" id="pCidade" placeholder="Ex: Curitiba – PR"></div>
          <div class="field"><label>Nome da sócia/representante</label><input type="text" id="pSocia"></div>
          <div class="field-row">
            <div class="field"><label>RG da representante</label><input type="text" id="pSociaRg"></div>
            <div class="field"><label>CPF da representante</label><input type="text" id="pSociaCpf"></div>
          </div>
          <div class="field"><label>Cidade de residência da representante</label><input type="text" id="pSociaCidade" placeholder="Ex: Pinhais – PR"></div>
        </div>
      </div>

      <!-- Testemunhas -->
      <div class="acc-item" data-acc="testemunhas">
        <button class="acc-header" type="button">
          <span class="acc-title">Testemunhas</span>
          <span class="acc-right"><span class="acc-summary" id="sumTestemunhas">Nenhuma</span><span class="acc-icon">+</span></span>
        </button>
        <div class="acc-body">
          <p class="hint">Também salvo automaticamente neste dispositivo.</p>
          <div class="field-row">
            <div class="field"><label>Testemunha 1 — nome</label><input type="text" id="t1Nome"></div>
            <div class="field"><label>CPF</label><input type="text" id="t1Cpf"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Testemunha 2 — nome</label><input type="text" id="t2Nome"></div>
            <div class="field"><label>CPF</label><input type="text" id="t2Cpf"></div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ===================== PREVIEW ===================== -->
  <section class="pane pane--preview" id="panePreview">
    <button id="editBtn" class="btn btn--dark pane--preview__editBtn" type="button">Editar</button>
    <div class="paper paper--doc" id="paper">
      <div id="docBody"></div>
    </div>
  </section>

</main>

<div class="page-footer">
  <p class="footer-signature">feito por <span>@juliamondt</span></p>
  <button id="exportBtn" class="btn-block" type="button">Exportar PDF</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="templates.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
